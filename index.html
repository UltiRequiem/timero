<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto"
    />

    <meta name="description" content="What time it was X hours ago?" />
    <meta name="keywords" content="Timezones, See the time in other Timezone" />
    <meta name="author" content="Eliaz Bobadilla" />

    <link rel="icon" href="/icon.svg" />

    <script type="module" src="/src/index.ts"></script>
    <title>Timero</title>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Timero</h1>
      </header>

      <main>
        <div class="input">
          <label for="time-zone">Time Zone</label>
          <input id="time-zone" />
        </div>

        <div id="results">
          <p></p>
          <p></p>
          <p></p>
        </div>

        <div class="buttons">
          <button id="shareTZ">Share Time Zone</button>
          <button id="randomTZ">Random Time Zone</button>
          <button id="toggleMenu" aria-expanded="false" aria-controls="tz-menu">
            All Time Zones
          </button>
        </div>

        <nav id="tz-menu" aria-label="All time zones" hidden>
          <input
            id="tz-filter"
            type="search"
            placeholder="Filter time zones..."
            aria-label="Filter time zones"
          />
          <ul id="tz-list"></ul>
        </nav>
      </main>

      <footer>
        <p>
          <a href="https://github.com/UltiRequiem">
            Eliaz Bobadilla (a.k.a UltiRequiem)
          </a>
        </p>
      </footer>
    </div>
  </body>
</html>
